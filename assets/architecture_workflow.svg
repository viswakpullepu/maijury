<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="520" style="background:#090b10;border-radius:16px;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0e111a"/>
    </linearGradient>
    <linearGradient id="prosecutorBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241113"/>
      <stop offset="100%" stop-color="#160a0c"/>
    </linearGradient>
    <linearGradient id="defenderBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2117"/>
      <stop offset="100%" stop-color="#0a150f"/>
    </linearGradient>
    <linearGradient id="arbiterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c142b"/>
      <stop offset="100%" stop-color="#120c1c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="520" rx="16" fill="#090b10" stroke="#1e2436" stroke-width="1.5"/>

  <!-- Header -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">MailJury End-to-End Adversarial Triage Architecture</text>
  <text x="50" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400" fill="#64748b">Offline-First • Zero Execution • Multi-Indicator Fusion • Autonomous OAuth Remediation</text>

  <!-- Step 1: Ingestion -->
  <g transform="translate(50, 105)">
    <rect width="210" height="140" rx="12" fill="url(#cardBg)" stroke="#222a3d" stroke-width="1.5"/>
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="0.5">INGESTION PIPELINE</text>
    <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Headless Stream</text>
    <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">• Live Gmail API (OAuth)</text>
    <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">• Spool Directory (incoming/)</text>
    <text x="18" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">• MTA Webhook Ingress</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="260" y1="175" x2="310" y2="175" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Attachment Forensics Engine -->
  <g transform="translate(310, 105)">
    <rect width="240" height="140" rx="12" fill="url(#cardBg)" stroke="#222a3d" stroke-width="1.5"/>
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">FORENSICS ENGINE</text>
    <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Zero-Execution Triage</text>
    <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">• Magic Bytes (MZ PE in .pdf)</text>
    <text x="18" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">• OOXML Macros / Template Inj.</text>
    <text x="18" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">• Encrypted ZIP + Body Pass</text>
  </g>

  <!-- Arrow 2 -> Trial -->
  <line x1="550" y1="175" x2="600" y2="175" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 3: Adversarial Courtroom (Split) -->
  <!-- Red Team Prosecutor -->
  <g transform="translate(600, 100)">
    <rect width="210" height="70" rx="10" fill="url(#prosecutorBg)" stroke="#451a1d" stroke-width="1.5"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#f87171" letter-spacing="0.5">⚔️ RED TEAM PROSECUTOR</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#fca5a5">Indictment Charges</text>
    <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#f87171">Fatal Payload Vetos &amp; Counts</text>
  </g>

  <!-- Blue Team Defender -->
  <g transform="translate(600, 185)">
    <rect width="210" height="70" rx="10" fill="url(#defenderBg)" stroke="#1a3b25" stroke-width="1.5"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#4ade80" letter-spacing="0.5">🛡️ BLUE TEAM DEFENDER</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#86efac">Exoneration Proofs</text>
    <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#4ade80">Certified Invoices &amp; Auth Urgency</text>
  </g>

  <!-- Connectors into Chief Justice -->
  <line x1="810" y1="135" x2="850" y2="160" stroke="#475569" stroke-width="1.5"/>
  <line x1="810" y1="220" x2="850" y2="190" stroke="#475569" stroke-width="1.5"/>

  <!-- Step 4: Chief Justice Arbiter -->
  <g transform="translate(850, 115)">
    <rect width="200" height="120" rx="12" fill="url(#arbiterBg)" stroke="#3b2057" stroke-width="1.5"/>
    <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#c084fc" letter-spacing="0.5">⚖️ CHIEF JUSTICE ARBITER</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#f3e8ff">Multi-Indicator Fusion</text>
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" fill="#d8b4fe">• Mitigates single weak signals</text>
    <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" fill="#d8b4fe">• Requires multi-vector proof</text>
    <text x="16" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" fill="#d8b4fe">• BSA §65B Digital Certificate</text>
  </g>

  <!-- Output Decision Split -->
  <!-- Downward Line from Arbiter -->
  <path d="M 950 235 V 300 H 550" stroke="#3b82f6" stroke-width="1.5" fill="none"/>

  <!-- Decision Outcomes -->
  <g transform="translate(50, 320)">
    <!-- Scam Outcome -->
    <g transform="translate(0, 0)">
      <rect width="470" height="150" rx="12" fill="url(#prosecutorBg)" stroke="#5c1d24" stroke-width="1.5"/>
      <circle cx="28" cy="32" r="10" fill="#ef4444"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">!</text>
      <text x="48" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14.5" font-weight="700" fill="#fca5a5">VERDICT: SCAM / MALICIOUS PHISHING</text>
      <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#f87171">Autonomous Action:</text>
      <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">1. Quarantined &amp; removed from user inbox immediately.</text>
      <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">2. <tspan fill="#fca5a5" font-weight="700">Warning email dispatched via Google OAuth send mail</tspan> to victim.</text>
      <text x="20" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">3. Cryptographic incident logged in immutable BSA §65B audit trail.</text>
    </g>

    <!-- Legit Outcome -->
    <g transform="translate(530, 0)">
      <rect width="470" height="150" rx="12" fill="url(#defenderBg)" stroke="#1a472c" stroke-width="1.5"/>
      <circle cx="28" cy="32" r="10" fill="#22c55e"/>
      <path d="M 23 32 L 26 35 L 33 28" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="48" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14.5" font-weight="700" fill="#86efac">VERDICT: VALIDATED LEGITIMATE / SAFE</text>
      <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#4ade80">Autonomous Action:</text>
      <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#cbd5e1">1. Certified Safe &amp; delivered directly to primary inbox.</text>
      <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#86efac" font-weight="700">2. STRICTLY NO EMAIL SENT (Zero noise &amp; 0.00% false alarms).</text>
      <text x="20" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#94a3b8">3. User works uninterrupted with zero workflow friction.</text>
    </g>
  </g>
</svg>
